name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    name: "Python ${{ matrix.python-version }}"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -e .

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Verify import
        run: python -c "from oniondb import OnionDB; print('OnionDB imported successfully')"

  test-numpy:
    runs-on: ubuntu-latest
    name: "Python 3.12 + numpy"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies with numpy
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov numpy
          pip install -e .

      - name: Run tests with numpy acceleration
        run: pytest tests/ -v --tb=short

      - name: Verify numpy coexistence
        run: python -c "import numpy; from oniondb import OnionDB; print('OnionDB + numpy coexist OK')"

  test-hnsw:
    runs-on: ubuntu-latest
    name: "Python 3.12 + numpy + hnswlib"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -e ".[all]"

      - name: Run full test suite (HNSW + GRF v2)
        run: pytest tests/ -v --tb=short

      - name: Verify HNSW coexistence
        run: python -c "import hnswlib; from oniondb import OnionDB; print('OnionDB + hnswlib coexist OK')"

  coverage:
    runs-on: ubuntu-latest
    name: "Coverage"
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -e ".[all]"

      - name: Run tests with coverage
        run: pytest tests/ --cov=oniondb --cov-report=term-missing --cov-fail-under=80
